name: Windows release arm64

on:
    release:
      types:
        - created

jobs:
    windows:
        name: Windows Py${{ matrix.PYTHON_VERSION }} arm64
        runs-on: windows-11-arm
        timeout-minutes: 10
        env:
            PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
            RUNNER_OS: "windows"
        strategy:
            fail-fast: false
            matrix:
                PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]
        steps:
            - name: Checkout branch
              uses: actions/checkout@v6
            - uses: nuget/setup-nuget@v4
              with:
                nuget-version: '5.x'
            - name: Remove free-threaded suffix from version
              env:
                PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
              shell: bash -l {0}
              run: |
                PYTHON_VERSION_NONSUFFIX=$PYTHON_VERSION
                PYTHON_PKG="pythonarm64"
                if [[ $PYTHON_VERSION = *t ]]; then
                  PYTHON_VERSION_NONSUFFIX=${PYTHON_VERSION//t}
                  echo "PYTHON_VERSION_NONSUFFIX=$PYTHON_VERSION_NONSUFFIX" >> $GITHUB_ENV
                  PYTHON_PKG="pythonarm64-freethreaded"
                  echo "PYTHON_PKG=$PYTHON_PKG" >> $GITHUB_ENV
                fi
                echo "PYTHON_PKG=$PYTHON_PKG" >> $GITHUB_ENV
                echo "PYTHON_VERSION_NONSUFFIX=$PYTHON_VERSION_NONSUFFIX" >> $GITHUB_ENV
            - name: Install Python via NuGet
              shell: bash -l {0}
              run: |
                nuget install $PYTHON_PKG -Version $PYTHON_VERSION_NONSUFFIX -Source https://api.nuget.org/v3/index.json -ExcludeVersion
                ls $PWD/$PYTHON_PKG/tools/
                NUGET_PYTHON=$PWD/$PYTHON_PKG/tools/python.exe
                WIN_NUGET_PYTHON=$(cygpath -w $NUGET_PYTHON)
                echo "NUGET_PYTHON=$NUGET_PYTHON" >> $GITHUB_ENV
                echo "WIN_NUGET_PYTHON=$WIN_NUGET_PYTHON" >> $GITHUB_ENV
            - name: Install build/test dependencies
              shell: bash -l {0}
              # Pin twine >= 6.1 / pkginfo >= 1.12 to handle the Metadata 2.4
              # `license-file` field emitted by current maturin.
              run: $NUGET_PYTHON -m pip install maturin toml "twine>=6.1" "pkginfo>=1.12"
            - name: Strip binary patterns from .gitignore
              shell: bash -l {0}
              # `.gitignore` blanket-excludes *.dll/*.exe so they stay out of
              # git, but maturin honours .gitignore when packaging the python
              # source directory. Strip those lines here so the ConPTY binaries
              # that build.rs downloads from NuGet (arm64 build) actually land
              # in the wheel.
              run: |
                sed -i '/[.]exe/c\' .gitignore
                sed -i '/[.]dll/c\' .gitignore
            - name: Build wheel
              shell: bash -l {0}
              run: $NUGET_PYTHON -m maturin build --release -i $NUGET_PYTHON
            - name: Sanity check wheel contents
              shell: bash -l {0}
              run: $NUGET_PYTHON .github/scripts/check_wheel.py 'target/wheels/*.whl' --has-conpty
            - name: Publish wheel
              env:
                TWINE_PASSWORD: ${{secrets.MATURIN_PASSWORD}}
                TWINE_USERNAME: ${{secrets.MATURIN_USERNAME}}
              shell: bash -l {0}
              run: $NUGET_PYTHON -m twine upload target/wheels/*.whl
