name: Tests

# Builds the exact wheels we release (via `build_wheels.yml`), then installs
# them on every supported Python and runs the test suite against the
# installed package. The abi3 wheel built on 3.10 is tested on 3.10-3.15;
# free-threaded interpreters get their own version-specific wheel.

on:
    push:
        branches:
            - main
    # No branch filter, so stacked PRs (targeting other PR branches) are tested too.
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        name: Build
        uses: ./.github/workflows/build_wheels.yml

    test:
        name: Test ${{ matrix.ARCH }} Py${{ matrix.PYTHON_VERSION }}
        needs: [build]
        runs-on: ${{ matrix.ARCH == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
        timeout-minutes: 15
        env:
            PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
            PYWINPTY_BLOCK: "1"
            CI_RUNNING: "1"
        strategy:
            fail-fast: false
            matrix:
                ARCH: ["x64", "arm64"]
                PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
        steps:
            - uses: nuget/setup-nuget@v4
              with:
                nuget-version: '5.x'
            - name: Install Python via NuGet
              shell: bash -l {0}
              run: |
                PYTHON_PKG=$([[ "${{ matrix.ARCH }}" == arm64 ]] && echo pythonarm64 || echo python)
                if [[ $PYTHON_VERSION = *t ]]; then
                  PYTHON_PKG="$PYTHON_PKG-freethreaded"
                fi
                nuget install $PYTHON_PKG -Version ${PYTHON_VERSION//t} -Source https://api.nuget.org/v3/index.json -ExcludeVersion -OutputDirectory "$RUNNER_TEMP"
                echo "NUGET_PYTHON=$RUNNER_TEMP/$PYTHON_PKG/tools/python.exe" >> $GITHUB_ENV
            - name: Download wheels
              uses: actions/download-artifact@v4
              with:
                pattern: dist-${{ matrix.ARCH }}-*
                path: dist
                merge-multiple: true
            - name: Install pywinpty and test dependencies
              shell: bash -l {0}
              # Let pip pick the wheel matching this interpreter from the
              # downloaded set (abi3 for GIL builds, cp3XXt for free-threaded).
              run: |
                ls dist
                $NUGET_PYTHON -m pip install --no-index --find-links dist pywinpty
                $NUGET_PYTHON -m pip install pytest flaky
            - name: Run tests against the installed wheel
              shell: bash -l {0}
              # There is no checkout here, so `winpty` is imported from
              # site-packages, i.e. from the wheel under test.
              working-directory: ${{ runner.temp }}
              run: $NUGET_PYTHON -m pytest -v -x --pyargs winpty.tests
