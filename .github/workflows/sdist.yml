name: sdist

# Builds and uploads the source distribution. Originally lived on Linux as a
# workaround for early maturin versions that failed to produce sdists on
# Windows; that's long since fixed, and the conda env activation on
# `ubuntu-latest` keeps tripping `python -m pip` (`No module named pip`).
# Run on `windows-11-arm` with the same NuGet-installed `pythonarm64` we use
# for the arm64 release - sidesteps the miniconda activation entirely and
# keeps build env identical to that release.

on:
    release:
      types:
        - created
    workflow_dispatch:
      inputs:
        ref:
          description: 'Git ref (tag/branch/SHA) to build the sdist from. Defaults to the branch the workflow was dispatched on.'
          required: false
          default: ''

jobs:
    sdist:
        name: sdist Py${{ matrix.PYTHON_VERSION }}
        runs-on: windows-11-arm
        timeout-minutes: 10
        env:
            PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
        strategy:
            fail-fast: false
            matrix:
                PYTHON_VERSION: ["3.11"]
        steps:
          - name: Checkout branch
            uses: actions/checkout@v6
            with:
              ref: ${{ inputs.ref || github.ref }}
          - uses: nuget/setup-nuget@v4
            with:
              nuget-version: '5.x'
          - name: Install Python via NuGet
            shell: bash -l {0}
            # Install *outside* the checkout. `maturin sdist` archives the
            # working tree, so a NuGet install landing in the repo root is
            # published inside the sdist: 3.0.5 and 3.1.0 both shipped ~16 MB
            # of vendored CPython this way (284 of 315 members), against ~31 KB
            # for 3.0.3. Resolved via `pwd` rather than `$RUNNER_TEMP` so the
            # path stays POSIX-style and safe to use unquoted in bash.
            run: |
              NUGET_DIR="$(cd .. && pwd)/nugetpy"
              mkdir -p "$NUGET_DIR"
              nuget install pythonarm64 -Version $PYTHON_VERSION -Source https://api.nuget.org/v3/index.json -ExcludeVersion -OutputDirectory "$NUGET_DIR"
              echo "NUGET_PYTHON=$NUGET_DIR/pythonarm64/tools/python.exe" >> $GITHUB_ENV
          - name: Install twine/maturin
            shell: bash -l {0}
            # Pin twine >= 6.1 / pkginfo >= 1.12 so the upload accepts the
            # Metadata 2.4 `license-file` field emitted by current maturin.
            run: $NUGET_PYTHON -m pip install "twine>=6.1" "pkginfo>=1.12" maturin
          - name: Build sdist distribution
            shell: bash -l {0}
            run: $NUGET_PYTHON -m maturin sdist
          - name: Sanity check sdist
            shell: bash -l {0}
            # `twine check` validates metadata only - it never inspects the
            # archive contents, which is why the oversized 3.0.5 and 3.1.0
            # sdists sailed through. check_sdist.py asserts no vendored
            # directories and a sane size.
            run: |
              $NUGET_PYTHON -m twine check target/wheels/*.tar.gz
              $NUGET_PYTHON .github/scripts/check_sdist.py 'target/wheels/*.tar.gz'
          - name: Upload to PyPi
            shell: bash -l {0}
            env:
                TWINE_PASSWORD: ${{secrets.MATURIN_PASSWORD}}
                TWINE_USERNAME: ${{secrets.MATURIN_USERNAME}}
            run: $NUGET_PYTHON -m twine upload target/wheels/*.tar.gz
