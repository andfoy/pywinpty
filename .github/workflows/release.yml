name: Release

# Builds every release artifact (x64 + arm64 wheels and the sdist) as workflow
# artifacts first, and only publishes to PyPI once *all* of them have built
# and passed their sanity checks. A failure in any build job leaves PyPI
# untouched, instead of shipping a partial release.
#
# Publishing uses PyPI Trusted Publishing (OIDC): no API tokens are stored in
# the repository. The `pypi` environment must be registered as a trusted
# publisher for this workflow (`release.yml`) on PyPI.

on:
    release:
      types:
        - published
    workflow_dispatch:
      inputs:
        ref:
          description: 'Git ref (tag/branch/SHA) to build from. Builds only; publishing runs on releases.'
          required: false
          default: ''

env:
    TWINE_SPEC: "twine>=6.1,<8"

jobs:
    build:
        name: Build
        uses: ./.github/workflows/build_wheels.yml
        with:
          ref: ${{ inputs.ref }}
          sdist: true

    publish:
        name: Publish to PyPI
        needs: [build]
        if: github.event_name == 'release'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: pypi
            url: https://pypi.org/project/pywinpty/${{ github.event.release.tag_name }}
        permissions:
            id-token: write
        steps:
            - name: Download all distributions
              uses: actions/download-artifact@v4
              with:
                pattern: dist-*
                path: dist
                merge-multiple: true
            - name: Check distribution set
              # 3 wheels (abi3, 3.14t, 3.15t) per architecture + the sdist.
              run: |
                ls -l dist
                test "$(ls dist/*-abi3-win_amd64.whl dist/*-abi3-win_arm64.whl | wc -l)" -eq 2
                test "$(ls dist/*.whl | wc -l)" -eq 6
                test "$(ls dist/*.tar.gz | wc -l)" -eq 1
            - name: Check distribution metadata
              run: pipx run --spec "$TWINE_SPEC" twine check dist/*
            - name: Publish
              uses: pypa/gh-action-pypi-publish@release/v1
