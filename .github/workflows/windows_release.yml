name: Windows release

on:
    release:
      types:
        - created

jobs:
    windows:
        name: Windows Py${{ matrix.PYTHON_VERSION }}
        runs-on: windows-latest
        env:
            PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
            RUNNER_OS: "windows"
        strategy:
            fail-fast: false
            matrix:
                PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]
        steps:
            - name: Checkout branch
              uses: actions/checkout@v6

            - uses: nuget/setup-nuget@v4
              with:
                nuget-version: '5.x'
            - name: Remove free-threaded suffix from version
              env:
                PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
              shell: bash -l {0}
              run: |
                PYTHON_VERSION_NONSUFFIX=$PYTHON_VERSION
                if [[ $PYTHON_VERSION = *t ]]; then
                  PYTHON_VERSION_NONSUFFIX=${PYTHON_VERSION//t}
                  echo "PYTHON_VERSION_NONSUFFIX=$PYTHON_VERSION_NONSUFFIX" >> $GITHUB_ENV
                fi
                echo "PYTHON_VERSION_NONSUFFIX=$PYTHON_VERSION_NONSUFFIX" >> $GITHUB_ENV
            - name: Install miniconda
              uses: conda-incubator/setup-miniconda@v4
              with:
                auto-update-conda: true
                miniforge-version: latest
                channels: conda-forge/label/python_rc,conda-forge
                conda-remove-defaults: "true"
                python-version: ${{ env.PYTHON_VERSION_NONSUFFIX }}
            - name: Reinstall free-threaded Python
              if: ${{ endsWith(matrix.PYTHON_VERSION, 't') }}
              shell: bash -l {0}
              run: |
                conda install --override-channels -c conda-forge python-freethreading
            - name: Conda env info
              shell: bash -l {0}
              run: conda env list
            - name: Install winpty
              shell: bash -l {0}
              run: conda install -y winpty
            - name: Install build/test dependencies
              shell: bash -l {0}
              # Pin twine >= 6.1 (and pkginfo >= 1.12) so the upload accepts
              # the `license-file` field that maturin emits per Metadata 2.4
              # (PEP 639). Older twine errors out with
              # "unrecognized or malformed field 'license-file'".
              run: pip install maturin toml "twine>=6.1" "pkginfo>=1.12"
            - name: Copy winpty binaries to package
              shell: bash -l {0}
              run: bash -l .github/scripts/copy_winpty.sh
            - name: Build wheel
              shell: bash -l {0}
              run: maturin build --release -i $(which python)
            - name: Sanity check wheel contents
              shell: bash -l {0}
              run: python .github/scripts/check_wheel.py 'target/wheels/*.whl' --has-conpty --has-winpty
            - name: Publish wheel
              env:
                TWINE_PASSWORD: ${{secrets.MATURIN_PASSWORD}}
                TWINE_USERNAME: ${{secrets.MATURIN_USERNAME}}
              shell: bash -l {0}
              run: twine upload target/wheels/*.whl
