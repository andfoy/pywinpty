[package]
name = "pywinpty"
version = "3.2.0-dev"
authors = ["Edgar Andrés Margffoy Tuay <andfoy@gmail.com>"]
description = "Pseudo terminal support for Windows from Python."
repository = "https://github.com/spyder-ide/pywinpty"
license = "MIT"
keywords = ["pty", "pseudo-terminal", "conpty", "windows", "winpty"]
readme = "README.md"
edition = "2024"

[lib]
name = "_winpty"
crate-type = ["cdylib"]

[build-dependencies]
glob = "0.3.2"

[dependencies]
winpty-rs = "1.0.6"

[dependencies.pyo3]
version = "0.30.1"
# abi3: one wheel per architecture covers every regular (GIL) CPython >= 3.10.
# Free-threaded interpreters do not support the limited API, so PyO3 falls back
# to a version-specific build for them (cp314t, cp315t).
features = ["extension-module", "abi3-py310"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
