[package]
name = "pywinpty"
version = "3.0.5+py315"
authors = ["Edgar Andrés Margffoy Tuay <andfoy@gmail.com>"]
description = "Pseudo terminal support for Windows from Python."
repository = "https://github.com/spyder-ide/pywinpty"
license = "MIT"
keywords = ["pty", "pseudo-terminal", "conpty", "windows", "winpty"]
readme = "README.md"
edition = "2024"

[lib]
name = "_winpty"
crate-type = ["cdylib"]

[build-dependencies]
glob = "0.3.2"

[dependencies]
winpty-rs = "1.0.6"

[dependencies.pyo3]
# 0.29 is the first release that supports CPython 3.15; 0.28's build script
# rejects any interpreter newer than 3.14.
version = "0.29.0"
features = ["extension-module"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
